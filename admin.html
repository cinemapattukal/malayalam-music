
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malayalam Music — Admin</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  background:#080808;color:#fff;font-family:Arial,sans-serif;padding:20px
}
.panel{
  width:100%;max-width:390px;background:#181818;
  border-radius:16px;padding:28px
}
.logo{font-size:24px;font-weight:bold;margin-bottom:8px}
.logo span{color:#1ed760}
p{color:#aaa;font-size:14px;line-height:1.6}
label{display:block;margin:18px 0 8px;font-size:14px}
input{
  width:100%;padding:13px;border-radius:7px;
  background:#282828;border:1px solid #444;color:#fff;font-size:16px
}
button{
  width:100%;padding:14px;border:0;border-radius:24px;
  background:#1ed760;color:#000;font-weight:bold;
  font-size:15px;cursor:pointer;margin-top:22px
}
button:disabled{opacity:.6}
#message{font-size:13px;overflow-wrap:anywhere}
</style>
</head>
<body>
<main class="panel">
  <div class="logo">♫ <span>Malayalam</span> Music</div>
  <h2>Admin Login</h2>
  <p>Sign in with your authorized administrator account.</p>

  <form id="loginForm">
    <label for="email">Email address</label>
    <input id="email" type="email" autocomplete="username" required>

    <label for="password">Password</label>
    <input id="password" type="password"
      autocomplete="current-password" required>

    <button id="loginButton" type="submit">Sign In</button>
  </form>
  <p id="message" role="status"></p>
</main>

<script type="module">
import { auth, db, authReady } from "./firebase.js";
import {
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {
  doc, getDoc
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginButton");

function showMessage(text) {
  message.textContent = text;
}

async function verifyAdmin(user) {
  await authReady;
  const adminRef = doc(db, "admins", user.uid);
  const snapshot = await getDoc(adminRef);

  return snapshot.exists()
    && snapshot.data().active === true
    && snapshot.data().role === "admin";
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  button.disabled = true;
  showMessage("Checking account...");

  try {
    await authReady;

    const credential = await signInWithEmailAndPassword(
      auth,
      document.getElementById("email").value.trim(),
      document.getElementById("password").value
    );

    if (!await verifyAdmin(credential.user)) {
      await signOut(auth);
      showMessage("Access denied. This account is not an authorized admin.");
      return;
    }

    showMessage("Admin verified. Login successful.");
    window.location.href = "./admin-dashboard.html";
  } catch (error) {
    console.error(error);
    showMessage("Login failed. Check your details and Firebase setup.");
  } finally {
    button.disabled = false;
  }
});

onAuthStateChanged(auth, async (user) => {
  if (!user) return;

  try {
    await authReady;
    if (await verifyAdmin(user)) {
      window.location.replace("./admin-dashboard.html");
    } else {
      await signOut(auth);
    }
  } catch (error) {
    console.error(error);
    showMessage("Could not verify admin access. Please sign in again.");
  }
});
</script>
</body>
</html>
